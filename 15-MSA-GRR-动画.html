<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MSA GR&R 动画</title>
<style>
body { font-family: "PingFang SC", sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
h1 { color: #00d4ff; text-align: center; }
.subtitle { color: #888; text-align: center; }
.grid { display: grid; grid-template-columns: 80px repeat(3, 1fr); gap: 4px; margin: 20px 0; }
.cell { aspect-ratio: 1.2; display: flex; align-items: center; justify-content: center; font-size: 18px; background: #34495e; border-radius: 3px; opacity: 0.3; }
.cell.active { opacity: 1; }
.cell.header { background: #1e1e1e; opacity: 1; font-weight: bold; }
.cell.highlighted { background: #3498db; transform: scale(1.1); box-shadow: 0 0 15px #00d4ff; }
.cell.label { background: transparent; opacity: 1; font-weight: bold; }
.controls { text-align: center; margin: 20px 0; }
button { background: #3498db; color: white; border: none; padding: 12px 24px; margin: 0 5px; border-radius: 5px; cursor: pointer; font-size: 16px; }
.legend { display: flex; justify-content: center; gap: 30px; margin: 20px 0; }
.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-color { width: 16px; height: 16px; border-radius: 3px; }
.results { text-align: center; margin: 20px 0; font-size: 20px; }
.metric { display: inline-block; margin: 0 15px; padding: 10px 20px; background: #34495e; border-radius: 5px; }
.metric-value { font-size: 24px; font-weight: bold; }
.pass { color: #27ae60; }
.warn { color: #f39c12; }
.fail { color: #c0392b; }
</style>
</head>
<body>
<div class="container">
    <h1>MSA GR&R 实验设计动画</h1>
    <p class="subtitle">基于 AIAG MSA 4th Edition(10 件 × 3 操作员 × 2 次 = 60 数据)</p>

    <div class="controls">
        <button onclick="animateStep(1)">步骤 1: 显示 10 件</button>
        <button onclick="animateStep(2)">步骤 2: 3 操作员测量</button>
        <button onclick="animateStep(3)">步骤 3: 60 数据点</button>
        <button onclick="animateStep(4)">步骤 4: 计算 GR&R</button>
        <button onclick="reset()">重置</button>
    </div>

    <div class="grid" id="grid">
        <!-- 11 行 × 4 列(标签 + 3 操作员) -->
    </div>

    <div class="legend">
        <div class="legend-item"><span class="legend-color" style="background:#3498db"></span> 高亮(已测量)</div>
        <div class="legend-item"><span class="legend-color" style="background:#34495e"></span> 待测量</div>
    </div>

    <div class="results" id="results">
        <div class="metric">EV: <span class="metric-value" id="ev">-</span></div>
        <div class="metric">AV: <span class="metric-value" id="av">-</span></div>
        <div class="metric">PV: <span class="metric-value" id="pv">-</span></div>
        <div class="metric">GR&R%: <span class="metric-value" id="grr">-</span></div>
        <div class="metric" id="verdict">评估: -</div>
    </div>
</div>

<script>
// 模拟 GR&R 数据(10 件 × 3 操作员 × 2 次 = 60 数据)
// 假设真实数据 + 测量误差
const trueValues = [50.00, 50.10, 50.05, 50.20, 49.95, 50.15, 50.08, 50.12, 50.03, 50.18];
const data = [];
for (let part = 0; part < 10; part++) {
    const row = [];
    for (let op = 0; op < 3; op++) {
        // 加入操作员偏移和测量误差
        const opBias = (op - 1) * 0.005;  // 操作员偏移
        const measError = (Math.random() - 0.5) * 0.006;  // 测量误差
        row.push(trueValues[part] + opBias + measError);
        row.push(trueValues[part] + opBias + (Math.random() - 0.5) * 0.006);  // 2 次
    }
    data.push(row);
}

function buildGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.appendChild(makeCell('label', '零件 \\ 操作员', true));
    grid.appendChild(makeCell('header', 'A', true));
    grid.appendChild(makeCell('header', 'B', true));
    grid.appendChild(makeCell('header', 'C', true));
    for (let part = 0; part < 10; part++) {
        grid.appendChild(makeCell('label', `P${part+1}`, true));
        for (let op = 0; op < 3; op++) {
            const cell = makeCell('', '', false);
            cell.id = `cell-${part}-${op}`;
            grid.appendChild(cell);
        }
    }
}

function makeCell(className, text, isHeader) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (className ? ' ' + className : '') + (isHeader ? ' header' : '');
    cell.textContent = text;
    return cell;
}

function animateStep(step) {
    reset(false);
    if (step === 1) {
        // 显示 10 件
        for (let part = 0; part < 10; part++) {
            const cell = document.getElementById(`cell-${part}-0`);
            cell.classList.add('active');
            cell.textContent = `P${part+1}`;
        }
    } else if (step === 2) {
        // 3 操作员
        for (let part = 0; part < 10; part++) {
            for (let op = 0; op < 3; op++) {
                const cell = document.getElementById(`cell-${part}-${op}`);
                cell.classList.add('active');
            }
        }
    } else if (step === 3) {
        // 60 数据
        for (let part = 0; part < 10; part++) {
            for (let op = 0; op < 3; op++) {
                const cell = document.getElementById(`cell-${part}-${op}`);
                cell.classList.add('active', 'highlighted');
                cell.textContent = data[part][op*2].toFixed(3);
            }
        }
    } else if (step === 4) {
        // 计算 GR&R
        // 简化计算
        const allData = data.flat();
        const mean = allData.reduce((a,b)=>a+b)/allData.length;
        const partMeans = data.map(row => (row[0]+row[1]+row[2]+row[3]+row[4]+row[5])/6);
        const opMeans = [[],[],[]];
        for (let part = 0; part < 10; part++) {
            for (let op = 0; op < 3; op++) {
                opMeans[op].push((data[part][op*2] + data[part][op*2+1])/2);
            }
        }
        const opMean = opMeans.map(arr => arr.reduce((a,b)=>a+b)/arr.length);
        
        // EV = 5.15 * R̄ (短生产运行平均极差)
        const ranges = data.map(row => Math.max(...row) - Math.min(...row));
        const rBar = ranges.reduce((a,b)=>a+b)/ranges.length;
        const EV = 5.15 * rBar;
        // AV = 5.15 * (max(op mean) - min(op mean))
        const AV = 5.15 * (Math.max(...opMean) - Math.min(...opMean));
        // PV = 5.15 * R̄(part) (零件极差)
        const partRange = Math.max(...partMeans) - Math.min(...partMeans);
        const PV = 5.15 * partRange;
        // GR&R
        const GRR = Math.sqrt(EV*EV + AV*AV);
        const TV = Math.sqrt(GRR*GRR + PV*PV);
        const GRR_pct = (GRR / TV) * 100;
        
        document.getElementById('ev').textContent = EV.toFixed(4);
        document.getElementById('av').textContent = AV.toFixed(4);
        document.getElementById('pv').textContent = PV.toFixed(4);
        document.getElementById('grr').textContent = GRR_pct.toFixed(1) + '%';
        
        const verdict = document.getElementById('verdict');
        if (GRR_pct < 10) {
            verdict.innerHTML = '评估: <span class="pass">优秀 (&lt;10%)</span>';
        } else if (GRR_pct < 30) {
            verdict.innerHTML = '评估: <span class="warn">可接受(边际)(10-30%)</span>';
        } else {
            verdict.innerHTML = '评估: <span class="fail">不可接受 (&gt;30%)</span>';
        }
    }
}

function reset(clearResults = true) {
    document.querySelectorAll('.cell').forEach(c => {
        if (!c.classList.contains('label') && !c.classList.contains('header')) {
            c.classList.remove('active', 'highlighted');
            c.textContent = '';
        }
    });
    if (clearResults) {
        document.getElementById('ev').textContent = '-';
        document.getElementById('av').textContent = '-';
        document.getElementById('pv').textContent = '-';
        document.getElementById('grr').textContent = '-';
        document.getElementById('verdict').innerHTML = '评估: -';
    }
}

buildGrid();

// 真·auto-play 演示(LALA 2026-07-29):每 2.5s 自动跑 1 步
let autoStep = 0;
setInterval(() => {
    autoStep = (autoStep % 4) + 1;
    animateStep(autoStep);
}, 2500);
animateStep(1);
</script>
</body>
</html>
