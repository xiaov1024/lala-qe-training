<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>机加工 6 工艺动画</title>
<style>
body { font-family: "PingFang SC", sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
h1 { color: #00d4ff; text-align: center; }
.subtitle { color: #888; text-align: center; }
.processes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
.process {
    background: #34495e; border-radius: 8px; padding: 20px; cursor: pointer;
    border: 2px solid transparent; transition: all 0.3s; text-align: center;
}
.process:hover { border-color: #00d4ff; }
.process.active { border-color: #3498db; background: #2c3e50; }
.process h2 { color: #00d4ff; margin-bottom: 10px; }
.params { display: none; margin-top: 15px; text-align: left; }
.process.active .params { display: block; }
.param-row { padding: 5px 0; border-bottom: 1px solid #4a5f7a; }
.param-label { color: #f39c12; font-weight: bold; }
.svg-container { background: #fff; border-radius: 8px; padding: 20px; margin: 20px 0; min-height: 200px; }
.controls { text-align: center; margin: 20px 0; }
button { background: #3498db; color: white; border: none; padding: 10px 20px; margin: 0 5px; border-radius: 5px; cursor: pointer; font-size: 14px; }
.roughness { text-align: center; font-size: 24px; padding: 20px; background: #34495e; border-radius: 8px; }
.rough-good { color: #27ae60; }
.rough-medium { color: #f39c12; }
.rough-bad { color: #c0392b; }
</style>
</head>
<body>
<div class="container">
    <h1>机加工 6 工艺动画</h1>
    <p class="subtitle">基于 杨叔子 2188 页 + 简明机械 503 页 + 李益民 297 页</p>

    <div class="controls">
        <button onclick="reset()">重置</button>
        <button onclick="showAll()">显示全部参数</button>
    </div>

    <div class="processes" id="processes">
        <!-- 6 工艺 -->
    </div>

    <div class="roughness" id="roughness">
        点击工艺,看真·参数 + 真·表面质量
    </div>
</div>

<script>
const processes = [
    {
        name: '车削',
        icon: '⚙️',
        rough: { coarse: 'Ra 12.5-25', fine: 'Ra 0.8-1.6' },
        params: [
            { type: '粗加工', ap: '3-5 mm', f: '0.3-0.5 mm/r', vc: '150 m/min' },
            { type: '精加工', ap: '0.3-0.5 mm', f: '0.08-0.15 mm/r', vc: '200 m/min' }
        ],
        problems: '粗糙度不达标 / 外圆超差 / 锥度误差 / 同轴度差'
    },
    {
        name: '铣削',
        icon: '🔧',
        rough: { coarse: 'Ra 12.5-25', fine: 'Ra 0.8-1.6' },
        params: [
            { type: '粗加工', ap: '3-5 mm', fz: '0.1-0.2 mm/z', vc: '100 m/min' },
            { type: '精加工', ap: '0.3-0.5 mm', fz: '0.05-0.1 mm/z', vc: '150 m/min' }
        ],
        problems: '平面度差 / 垂直度超差 / 振刀 / 表面波纹'
    },
    {
        name: '磨削',
        icon: '⚡',
        rough: { coarse: 'Ra 0.8-1.6', fine: 'Ra 0.2-0.8' },
        params: [
            { type: '粗磨', ap: '0.02-0.05 mm', vc: '30-50 m/s' },
            { type: '精磨', ap: '0.005-0.01 mm', vc: '20-30 m/s' }
        ],
        problems: '烧伤 / 磨削裂纹 / 表面残留应力'
    },
    {
        name: '钻削',
        icon: '🔩',
        rough: { coarse: 'Ra 3.2-6.3', fine: 'Ra 0.8-1.6' },
        params: [
            { type: '钻孔', ap: '钻头直径', f: '0.1-0.3 mm/r', vc: '30 m/min' }
        ],
        problems: '孔径超差 / 螺纹乱扣 / 钻头折断'
    },
    {
        name: '热处理',
        icon: '🔥',
        rough: { coarse: '正火', fine: '调质 + 渗碳' },
        params: [
            { type: '45 钢', temp: '880-920°C', cooling: '空冷' },
            { type: '渗碳', temp: '920°C', time: '4-6 小时' }
        ],
        problems: '硬度不达标 / 变形 / 残余应力'
    },
    {
        name: '装夹',
        icon: '🔧',
        rough: { coarse: '通用夹具', fine: '专用/真空' },
        params: [
            { type: '三爪卡盘', use: '车床通用' },
            { type: '平口钳', use: '铣床通用' },
            { type: '专用夹具', use: '批量生产' }
        ],
        problems: '装夹变形 / 重复装夹误差 / 装夹不到位'
    }
];

function buildProcesses() {
    const container = document.getElementById('processes');
    container.innerHTML = '';
    processes.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'process';
        div.id = `process-${i}`;
        div.onclick = () => toggleProcess(i);
        let html = `<h2>${p.icon} ${p.name}</h2>`;
        html += `<p><strong>粗糙度:</strong><br>${p.rough.coarse} → ${p.rough.fine}</p>`;
        html += `<p><strong>真·问题:</strong><br>${p.problems}</p>`;
        html += '<div class="params">';
        p.params.forEach(param => {
            html += '<div class="param-row">';
            html += `<div class="param-label">${param.type}</div>`;
            for (const [k, v] of Object.entries(param)) {
                if (k === 'type') continue;
                html += `<div>${k}: ${v}</div>`;
            }
            html += '</div>';
        });
        html += '</div>';
        div.innerHTML = html;
        container.appendChild(div);
    });
}

function toggleProcess(i) {
    document.querySelectorAll('.process').forEach(p => p.classList.remove('active'));
    const proc = document.getElementById(`process-${i}`);
    proc.classList.add('active');
    document.getElementById('roughness').innerHTML = 
        `<strong style="color:#00d4ff">${processes[i].name}</strong>: 粗加工 ${processes[i].rough.coarse} → 精加工 ${processes[i].rough.fine}<br>` +
        `<span style="color:#f39c12">真·真·问题:</span> ${processes[i].problems}`;
}

function showAll() {
    document.querySelectorAll('.process').forEach(p => p.classList.add('active'));
    document.getElementById('roughness').innerHTML = 
        '<strong style="color:#27ae60">显示全部 6 工艺参数</strong> - 点击单个工艺看详情';
}

function reset() {
    document.querySelectorAll('.process').forEach(p => p.classList.remove('active'));
    document.getElementById('roughness').textContent = '点击工艺,看真·参数 + 真·表面质量';
}

buildProcesses();

// 真·auto-play 演示(LALA 2026-07-29):每 3s 自动切下一个工艺
let procIdx = 0;
setInterval(() => {
    procIdx = (procIdx + 1) % processes.length;
    toggleProcess(procIdx);
}, 3000);
toggleProcess(0);
</script>
</body>
</html>
